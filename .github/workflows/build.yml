name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --release -p mk-worker
      - run: cargo build --release -p mk-worker
      - uses: actions/upload-artifact@v4
        with:
          name: mkworker-windows-x86_64
          path: |
            target/release/mkworker.exe
            target/release/mkworker-tray.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - run: cargo test --release -p mk-worker
      - run: cargo build --release -p mk-worker --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/mkworker mkworker-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: mkworker-linux-x86_64
          path: mkworker-linux-x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mkworker.exe
            dist/mkworker-tray.exe
            dist/mkworker-linux-x86_64
