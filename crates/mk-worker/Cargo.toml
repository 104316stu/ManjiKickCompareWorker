[package]
name = "mk-worker"
version = "0.2.1"
edition = "2021"
description = "ManjiKick compare worker: leases audio compares from audios.manjikick.com and runs them here"

[lib]
name = "mkworker"
path = "src/lib.rs"

[[bin]]
name = "mkworker"
path = "src/bin/mkworker.rs"

[[bin]]
name = "mkworker-tray"
path = "src/bin/mkworker-tray.rs"

[features]
# Builds against a stand-in for mk-core (no real compares) so the worker can
# be compile-checked and dry-run before mk-core lands. Never ship with it.
core-shim = []

[dependencies]
mk-core = { path = "../mk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

# TLS: Windows uses SChannel through native-tls (no C compiler needed on the
# GNU toolchain); Linux uses rustls with bundled webpki roots, so a bare
# container without a CA store still works.
[target.'cfg(windows)'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
# schannel 0.1.28+ moved to windows-sys 0.61 (raw-dylib), which the GNU
# toolchain can only link with a full binutils; 0.1.27 is the same API.
schannel = ">=0.1.23, <0.1.28"
# The popup panel. 0.35 is the last line on windows 0.59, which links with
# import libraries (later ones need raw-dylib).
webview2-com = "0.35"
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT"] }
windows-core = "0.59"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls"] }
libc = "0.2"
